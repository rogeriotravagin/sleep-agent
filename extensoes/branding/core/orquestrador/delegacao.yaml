# Regras de Delegacao - Extensao Branding
# Define qual agente atende cada tipo de pedido

# =====================================================
# CONFIGURACAO DE OUTPUT
# =====================================================

output:
  extensao: branding
  tipos:
    - logos
    - paletas
    - tipografias
    - design-systems
    - landing-pages
    - styleguides
    - analises
    - identidades
  auto_criar: true

# =====================================================
# AGENTES
# =====================================================

# Agente Design Analyst
design_analyst:
  agente: agentes/DESIGN-ANALYST.md
  gatilhos:
    - analisar referencia
    - analisar print
    - analisar screenshot
    - analisar pagina
    - analisar site
    - extrair design
    - extrair diretrizes
    - extrair padroes
    - criar style guide
    - criar styleguide
    - diretrizes de design
    - reverse engineering
    - desconstruir design
    - copiar design
    - replicar design
  tarefas:
    - analisar-referencia
    - extrair-diretrizes
    - criar-styleguide

# Agente Designer (identidade visual geral)
designer:
  agente: agentes/BRAND-DESIGNER.md
  gatilhos:
    - identidade visual
    - paleta de cores
    - tipografia
    - design grafico
    - elementos visuais
    - marca visual
  tarefas:
    - paleta-cores

# =====================================================
# TIME DE LOGO ESPECIALISTA (v3.0 - HTML-first)
# Processo: Architect → Craftsman (HTML) → Critic
# Logo criado em HTML + CSS. SVG exportado para favicon.
# =====================================================

# Agente Logo Architect (conceituacao estrategica)
logo_architect:
  agente: agentes/LOGO-ARCHITECT.md
  gatilhos:
    - logo
    - criar logo
    - conceito de logo
    - briefing de logo
    - conceituacao visual
  tarefas:
    - criar-logo

# Agente Logo Craftsman (execucao HTML-first, SVG export)
logo_craftsman:
  agente: agentes/LOGO-CRAFTSMAN.md
  gatilhos:
    - executar logo
    - html logo
    - construir logo
    - implementar logo
    - svg logo
    - favicon
  tarefas:
    - executar-logo-html
    - exportar-logo-svg

# Agente Logo Critic (validacao implacavel)
logo_critic:
  agente: agentes/LOGO-CRITIC.md
  gatilhos:
    - validar logo
    - avaliar logo
    - testar logo
    - criticar logo
  tarefas:
    - validar-logo

# Agente UI/UX
uiux:
  agente: agentes/UI-UX.md
  gatilhos:
    - landing page
    - interface
    - wireframe
    - prototipo
    - design system
    - componentes
    - UI
    - UX
  tarefas:
    - criar-landing
    - design-system

# Agente Brand Strategist
brand_strategist:
  agente: agentes/BRAND-STRATEGIST.md
  gatilhos:
    - estrategia de marca
    - posicionamento
    - brand voice
    - arquetipo
    - golden circle
    - personal branding
    - marca pessoal
  tarefas:
    - posicionamento-marca
    - personal-branding
    - definir-marca

# =====================================================
# REGRAS DE PRIORIDADE
# =====================================================

prioridade:
  ordem:
    - design_analyst     # Primeiro: analise de referencias
    - brand_strategist   # Segundo: estrategia
    - logo_architect     # Terceiro: conceituacao de logo
    - logo_craftsman     # Quarto: execucao HTML + SVG export
    - logo_critic        # Quinto: validacao
    - designer           # Sexto: identidade visual geral
    - uiux               # Setimo: interfaces

# =====================================================
# CASOS ESPECIAIS
# =====================================================

casos_especiais:
  multi_agente:
    - gatilho: "brand completo"
      workflow: workflows/brand-completo.yaml
    - gatilho: "identidade completa"
      workflow: workflows/identidade-visual.yaml
    - gatilho: "analisar e criar"
      workflow: workflows/analise-design.yaml
    - gatilho: "logo profissional"
      workflow: workflows/logo-profissional.yaml
    - gatilho: "criar logo"
      workflow: workflows/logo-profissional.yaml

  explorar_primeiro:
    - "quero criar uma marca"
    - "preciso de identidade visual"
    - "quero copiar esse design"
    - "fazer igual a essa pagina"
